<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Nucleo 377</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <img class="brand-mark" src="/static/nucleo-mark.svg" alt="Nucleo 377">
        <p>Dashboard executivo</p>
        <h1>{{ obra }}</h1>
        <span>{{ cliente }} · {{ health_status }}</span>
      </header>
      {{ metrics }}
      <section class="grid">
        <article>
          <h2>Riscos ativos</h2>
          {{ active_risks }}
        </article>
        <article>
          <h2>Acoes de gestao</h2>
          {{ actions }}
        </article>
      </section>
      <section>
        <h2>Resumo por departamento</h2>
        {{ department_summary }}
      </section>
    </main>
  </body>
</html>
