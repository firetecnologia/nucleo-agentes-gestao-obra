<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Nucleo 377</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <img class="brand-mark" src="/static/nucleo-mark.svg" alt="Nucleo 377">
        <p>Rascunho para cliente</p>
        <h1>{{ obra }}</h1>
        <span>{{ health_status }}</span>
      </header>
      <section class="notice">
        <strong>{{ review_notice }}</strong>
        <span>{{ external_delivery }}</span>
      </section>
      <section class="draft">
        {{ body }}
      </section>
      <section class="grid">
        <article>
          <h2>Proximos passos</h2>
          {{ next_steps }}
        </article>
        <article>
          <h2>Decisoes do cliente</h2>
          {{ pending_client_decisions }}
        </article>
      </section>
    </main>
  </body>
</html>
